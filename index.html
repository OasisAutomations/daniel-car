<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daniel Car</title>
<meta name="theme-color" content="#050706">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Daniel Car">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
/* ===== Daniel Car v2.0: plain music player, static neon tube-line look ===== */
:root{--core:#d9ffd2;--ink:#eef6ec;--mut:rgba(220,240,215,.52);--bgc:#050706;
  --glow:0 0 1.5px rgba(217,255,210,.9),0 0 6px rgba(57,255,20,.45),0 0 16px rgba(57,255,20,.18);
  --glow-hi:0 0 2px rgba(217,255,210,1),0 0 9px rgba(57,255,20,.6),0 0 26px rgba(57,255,20,.28);
  --iglow:drop-shadow(0 0 1px rgba(217,255,210,.9)) drop-shadow(0 0 5px rgba(57,255,20,.5))}
html,body{height:100%;margin:0}
body{background:var(--bgc);overflow:hidden;color:var(--ink);font:400 16px/1.35 Inter,Roboto,"Segoe UI",system-ui,-apple-system,sans-serif;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#car{position:fixed;inset:0;display:flex;flex-direction:column;padding:max(18px,env(safe-area-inset-top)) 22px max(18px,env(safe-area-inset-bottom));overflow:hidden;
  background:radial-gradient(120% 80% at 20% 15%,rgba(57,255,20,.035),transparent 60%),var(--bgc)}
#car *{box-sizing:border-box}
#car button{all:unset;box-sizing:border-box;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
/* neon line primitives (static: nothing animates while music plays) */
#car .nl{border:1.5px solid var(--core);border-radius:999px;box-shadow:var(--glow),inset 0 0 6px rgba(57,255,20,.18)}
#car .nl:active{box-shadow:var(--glow-hi),inset 0 0 10px rgba(57,255,20,.3);transform:scale(.97)}
#car .nl svg{width:46%;height:46%;fill:none;stroke:var(--core);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;filter:var(--iglow);overflow:visible}
#car .ib{display:grid!important;place-items:center}
/* top bar */
#car .cbar{display:flex;align-items:center;gap:14px;min-height:56px}
#car .brand{flex:1;font-weight:500;letter-spacing:.32em;font-size:13px;color:var(--core);text-shadow:0 0 6px rgba(57,255,20,.45)}
#car .pill{flex:1;min-width:0;text-align:center;font-size:13px;letter-spacing:.06em;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#car .pill b{color:var(--core);font-weight:500}
#car .tb{width:56px;height:56px;flex:none}
@media (orientation:portrait){#car .cbar{flex-wrap:wrap}#car .pill{order:3;flex-basis:100%;text-align:left;margin-top:6px}}
/* main */
#car .cmain{flex:1;display:flex;flex-direction:column;justify-content:center;gap:24px;min-height:0}
#car .info{display:flex;flex-direction:column;gap:10px;min-width:0}
#car .meta{font-size:13px;letter-spacing:.08em;color:var(--mut);min-height:18px}
#car .ttl{font-size:clamp(28px,8.2vw,46px);font-weight:600;letter-spacing:-.01em;line-height:1.12;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
#car .art{font-size:clamp(18px,4.8vw,24px);color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#car .times{display:flex;justify-content:space-between;font-size:14px;color:var(--mut);font-variant-numeric:tabular-nums}
#car .next{font-size:15px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:20px}
#car .next span{color:var(--ink);opacity:.85}
#car .ctrl{display:flex;align-items:center;justify-content:center;gap:clamp(22px,7vw,44px)}
#car .sk{width:clamp(84px,22vw,104px);height:clamp(84px,22vw,104px)}
#car .pp{width:clamp(124px,34vw,152px);height:clamp(124px,34vw,152px);border-width:2px}
#car .pp svg{width:38%;height:38%;stroke-width:1.6}
#car .vol{display:flex;align-items:center;gap:16px;padding:4px 2px}
#car .vol svg{width:28px;height:28px;flex:none;fill:none;stroke:var(--core);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;filter:var(--iglow)}
/* sliders: seek + volume */
#car input.cr{-webkit-appearance:none;appearance:none;width:100%;flex:1;height:44px;background:transparent;margin:0;touch-action:none}
#car input.cr::-webkit-slider-runnable-track{height:2px;border-radius:2px;background:linear-gradient(90deg,var(--core) var(--v,0%),rgba(217,255,210,.15) var(--v,0%));box-shadow:0 0 6px rgba(57,255,20,.35)}
#car input.cr::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-14px;border-radius:50%;background:var(--bgc);border:1.5px solid var(--core);box-shadow:var(--glow)}
#car input.seek::-webkit-slider-thumb{width:22px;height:22px;margin-top:-10px;background:#f2fff0}
#car input.cr::-moz-range-track{height:2px;background:rgba(217,255,210,.15)}
#car input.cr::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:var(--bgc);border:1.5px solid var(--core)}
#car .toast{position:absolute;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%);opacity:0;max-width:88%;visibility:hidden;
  padding:12px 20px;border-radius:14px;background:rgba(5,8,6,.94);border:1px solid rgba(217,255,210,.5);font-size:15px;text-align:center;pointer-events:none;z-index:9}
#car .toast.show{opacity:1;visibility:visible}
/* sheets */
#car .sheet{position:absolute;inset:0;z-index:4;background:#040605;display:none;flex-direction:column;padding:max(18px,env(safe-area-inset-top)) 22px max(18px,env(safe-area-inset-bottom))}
#car .sheet.open{display:flex}
#car .sh{display:flex;align-items:center;gap:14px;min-height:56px;margin-bottom:10px}
#car .sh h2{flex:1;margin:0;font-size:22px;font-weight:500;letter-spacing:.04em}
#car .sb{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 2px 30px;display:flex;flex-direction:column;gap:14px}
#car .sec{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--mut);margin:14px 0 2px}
#car .row2{display:flex;gap:12px;flex-wrap:wrap}
#car .btn{min-height:60px;padding:0 22px;display:flex!important;align-items:center;justify-content:center;gap:10px;border-radius:16px!important;font-size:17px;font-weight:500;flex:1 1 140px;text-align:center}
#car .btn svg{width:22px;height:22px;flex:none}
#car .li{display:flex!important;align-items:center;gap:14px;min-height:64px;padding:8px 6px;border-bottom:1px solid rgba(217,255,210,.12)}
#car .li .t{flex:1;min-width:0}
#car .li .t b{display:block;font-weight:500;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#car .li .t small{display:block;font-size:13px;color:var(--mut);margin-top:3px}
#car .li.now b{color:var(--core);text-shadow:0 0 6px rgba(57,255,20,.4)}
#car .li .x{width:48px;height:48px;flex:none}
#car .li .x svg{width:40%;height:40%}
#car .set{display:flex;flex-direction:column;gap:10px}
#car .set label{font-size:17px;font-weight:500}
#car .set small{font-size:13px;color:var(--mut)}
#car .seg{display:flex;gap:8px;flex-wrap:wrap}
#car .seg button{flex:1 1 auto;min-height:54px;padding:0 14px;display:flex!important;align-items:center;justify-content:center;border-radius:14px;border:1px solid rgba(217,255,210,.25);color:var(--mut);font-size:15px}
#car .seg button.on{border-color:var(--core);color:var(--ink);box-shadow:var(--glow)}
#car .empty2{color:var(--mut);font-size:15px;padding:18px 4px;text-align:center}
/* v2.1 Music screen: pinned controls + one scrolling list */
#car #sLib .sh{margin-bottom:12px}
#car .mtools{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
#car .mtools .btn{min-height:64px;padding:6px 8px;flex-direction:column;gap:4px;font-size:15px;line-height:1.15;border-radius:16px!important}
#car .mtools .btn svg{width:22px;height:22px}
#car .mtabs{flex:none;margin:14px 0 6px;flex-wrap:nowrap}
#car .mtabs button{flex:1 1 0;min-height:52px;padding:0 6px;font-size:15px;white-space:nowrap}
#car .mtabs span{opacity:.7;margin-left:4px}
#car .mlist{position:relative;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 2px 24px;border-top:1px solid rgba(217,255,210,.12)}
@media (orientation:landscape) and (max-height:600px){#car .mtools{grid-template-columns:repeat(6,1fr)}#car .mtools .btn{min-height:56px;font-size:13px}#car .mtabs{margin:8px 0 4px}}
/* v2.2 dash mode: night colors, static styling (only the canvas moves) */
#car #dash{position:absolute;inset:0;z-index:6;background:#010201;display:flex;flex-direction:column;overflow:hidden;
  padding:max(14px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));
  --dk:rgba(196,255,184,.80);--dm:rgba(170,232,160,.46);--dl:rgba(190,255,175,.55);--dg:rgba(57,255,20,.16)}
#car #dash[hidden]{display:none}
#car #dash.xdim{--dk:rgba(170,235,160,.42);--dm:rgba(150,210,140,.26);--dl:rgba(170,235,160,.30);--dg:rgba(57,255,20,.07)}
#car #dViz{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#car #dash.noviz #dViz{display:none}
#car #dash .dtop,#car #dash .dmain,#car #dash .dhint{position:relative;z-index:1}
#car #dash .nl{border-color:var(--dl);box-shadow:0 0 1px var(--dl),0 0 10px var(--dg),inset 0 0 5px var(--dg)}
#car #dash .nl:active{box-shadow:0 0 2px var(--dk),0 0 14px rgba(57,255,20,.3)}
#car #dash .nl svg{stroke:var(--dk);filter:none}
#car .dtop{display:flex;align-items:center;gap:12px;min-height:56px}
#car .dsp{flex:1}
#car .dbtn{width:56px;height:56px;flex:none}
#car .dpill{min-height:52px;padding:0 18px;display:flex!important;align-items:center;font-size:15px;letter-spacing:.08em;color:var(--dk)}
#car .dmain{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-between;gap:18px;padding-top:4vh}
#car .dinfo{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;min-width:0}
#car .dclock{font-size:clamp(84px,27vw,190px);font-weight:200;line-height:.95;letter-spacing:-.03em;color:var(--dk);font-variant-numeric:tabular-nums;text-shadow:0 0 22px var(--dg)}
#car .dclock small{font-size:.2em;letter-spacing:.1em;margin-left:.3em;color:var(--dm);font-weight:400}
#car .ddate{font-size:15px;letter-spacing:.24em;text-transform:uppercase;color:var(--dm);margin-bottom:3vh}
#car .dttl{font-size:clamp(26px,7.4vw,44px);font-weight:600;line-height:1.12;color:var(--dk);max-width:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
#car .dart{font-size:clamp(17px,4.6vw,24px);color:var(--dm);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:1.2em}
#car .dprog{align-self:stretch;height:3px;border-radius:3px;background:rgba(190,255,175,.10);margin-top:14px;overflow:hidden}
#car .dprog i{display:block;height:100%;width:0;background:var(--dk);box-shadow:0 0 6px var(--dg)}
#car .dtimes{align-self:stretch;display:flex;justify-content:space-between;font-size:14px;color:var(--dm);font-variant-numeric:tabular-nums}
#car .dctrl{display:flex;align-items:center;justify-content:center;gap:clamp(20px,7vw,44px);padding-bottom:2vh}
#car .dsk{width:clamp(88px,23vw,112px);height:clamp(88px,23vw,112px)}
#car .dpp{width:clamp(128px,35vw,160px);height:clamp(128px,35vw,160px);border-width:2px}
#car .dpp svg{width:38%;height:38%}
#car .dhint{position:absolute;left:0;right:0;bottom:max(16px,env(safe-area-inset-bottom));text-align:center;font-size:13px;letter-spacing:.14em;color:var(--dm);opacity:0;pointer-events:none}
#car #dash.noctl .dctl{opacity:0;pointer-events:none}
#car #dash.noctl .dhint{opacity:.6}
@media (orientation:landscape){
  #car .dmain{display:grid;grid-template-columns:1fr 1fr;align-items:center;padding-top:0;gap:28px}
  #car .dclock{font-size:clamp(72px,24vh,170px)}
  #car .ddate{margin-bottom:2vh}
  #car .dttl{font-size:clamp(22px,6vh,40px)}
  #car .dctrl{padding-bottom:0;gap:clamp(40px,8vw,64px)}
  #car .dsk{width:clamp(68px,19vh,80px);height:clamp(68px,19vh,80px)}#car .dpp{width:clamp(100px,28vh,120px);height:clamp(100px,28vh,120px)}
}
/* v2.4 library: search-first, big touch targets, virtual list */
#car .bsearch{flex:none;display:flex}
#car .bsearch input{all:unset;box-sizing:border-box;flex:1;min-width:0;height:60px;padding:0 20px;border:1.5px solid var(--core);border-radius:16px;font-size:19px;color:var(--ink);box-shadow:var(--glow);user-select:text;-webkit-user-select:text}
#car .bsearch input::placeholder{color:var(--mut)}
#car .ctabs,#car .stabs,#car .recent,#car .decs{flex:none;display:flex;gap:8px;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
#car .ctabs::-webkit-scrollbar,#car .stabs::-webkit-scrollbar,#car .recent::-webkit-scrollbar,#car .decs::-webkit-scrollbar{display:none}
#car .ctabs{margin-top:12px;display:grid;grid-template-columns:repeat(4,1fr)}#car .ctabs button{min-width:0;min-height:60px;padding:4px 6px;font-size:15px;flex-direction:column;gap:2px;line-height:1.12;white-space:normal;text-align:center}
@media (orientation:portrait){#car .cbar{gap:10px}#car .brand{min-width:0;overflow:hidden;white-space:nowrap;letter-spacing:.2em}#car .tb{width:54px;height:54px}}
#car .ctabs span{font-size:12px;opacity:.65}
#car .stabs{margin-top:10px}#car .stabs button{flex:0 0 auto;min-height:50px;padding:0 18px;font-size:15px}
#car .stabs[hidden],#car .recent[hidden],#car .bhead[hidden],#car .az[hidden],#car .cimg[hidden],#car .azpop[hidden]{display:none}
#car .bstat{flex:none;font-size:13px;color:var(--mut);margin:8px 2px 0;display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap}
#car .bstat button{min-height:44px;padding:0 16px;border:1px solid rgba(217,255,210,.45);border-radius:12px;color:var(--ink);font-size:14px;display:flex!important;align-items:center}
#car .recent{margin-top:10px;align-items:stretch}
#car .recent small{flex:none;writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);text-align:center}
#car .recent button{flex:0 0 auto;max-width:200px;min-height:52px;padding:6px 14px;border:1px solid rgba(217,255,210,.25);border-radius:14px;font-size:14px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block!important}
#car .recent button i{display:block;font-style:normal;font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis}
#car .bhead{flex:none;display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
#car .bhead h3{flex:1;margin:0;font-size:15px;font-weight:400;color:var(--mut)}
#car .bhead .hb{flex:1 1 120px;min-height:56px}
#car .decs{flex-basis:100%}#car .decs button{flex:0 0 auto;min-height:46px;padding:0 14px;font-size:14px}
#car .bwrap{position:relative;flex:1;min-height:0;margin-top:10px;border-top:1px solid rgba(217,255,210,.12)}
#car .vl{position:absolute;top:0;bottom:0;left:0;right:40px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#car .vl.noaz{right:0}
#car .vl .sp{position:relative}
#car .vl .li{position:absolute;left:0;right:0;height:68px;min-height:0;padding:6px 4px}
#car .vl .li.off{opacity:.45}
#car .vl .li .t small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#car .tag{display:inline-block;font-size:11px;line-height:1.3;padding:0 6px;border:1px solid rgba(217,255,210,.4);border-radius:6px;margin-right:6px;color:var(--ink)}
#car .li .fav.on svg{fill:var(--core)}
#car .az{position:absolute;top:0;bottom:0;right:0;width:40px;display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:600;color:rgba(220,240,215,.22);touch-action:none;padding:2px 0}
#car .az span{flex:1;display:flex;align-items:center;justify-content:center;width:100%}
#car .az span.on{color:var(--core)}
#car .azpop{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);width:96px;height:96px;border-radius:20px;display:grid;place-items:center;font-size:52px;background:rgba(5,8,6,.94);border:1.5px solid var(--core);box-shadow:var(--glow);z-index:3;pointer-events:none}
#car .pick{position:absolute;inset:0;z-index:8;background:#040605;display:none;flex-direction:column;padding:max(18px,env(safe-area-inset-top)) 22px max(18px,env(safe-area-inset-bottom))}
#car .pick.open{display:flex}
#car .pick .sb .btn{flex:none}
#car .cimg{width:clamp(64px,18vw,104px);height:clamp(64px,18vw,104px);border-radius:12px;object-fit:cover;border:1px solid rgba(217,255,210,.25);flex:none}
#car .vlab{text-align:center;font-size:12px;letter-spacing:.2em;color:var(--mut);margin-top:16px}
@media (orientation:landscape) and (max-height:600px){
  #car{padding-left:max(28px,env(safe-area-inset-left));padding-right:max(28px,env(safe-area-inset-right))}
  #car .cmain{display:grid;grid-template-columns:1.15fr 1fr;grid-template-rows:1fr auto;column-gap:40px;row-gap:10px;align-items:center}
  #car .info{grid-row:1/3}#car .ttl{font-size:clamp(26px,4.4vw,42px)}
  #car .sk{width:84px;height:84px}#car .pp{width:120px;height:120px}#car .cbar{min-height:48px}#car .tb{width:52px;height:52px}
}
</style>
</head>
<body>
<div id="car">
  <div class="cbar">
    <span class="brand">DANIEL&nbsp;CAR</span>
    <span class="pill" id="cPill">Tap Music to add songs</span>
    <button class="nl ib tb" id="cDash" aria-label="Dash mode"><svg viewBox="0 0 24 24"><path d="M3.5 17a8.5 8.5 0 1 1 17 0"/><path d="M12 17l4.2-5.2"/><path d="M6.2 12.2l1.3.8M12 6.5V8M17.8 12.2l-1.3.8"/></svg></button>
    <button class="nl ib tb" id="cBrw" aria-label="Library"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg></button>
    <button class="nl ib tb" id="cLib" aria-label="Music"><svg viewBox="0 0 24 24"><path d="M4 6h11M4 12h11M4 18h7"/><path d="M19 16.5V5l3 1.5"/><circle cx="17" cy="17" r="2.2"/></svg></button>
    <button class="nl ib tb" id="cSet" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
  </div>
  <div class="cmain">
    <div class="info">
      <img class="cimg" id="cImg" alt="" hidden>
      <div class="meta" id="cMeta"></div>
      <div class="ttl" id="cTitle">Ready to roll</div>
      <div class="art" id="cArtist">Add your music, then press play</div>
      <input type="range" class="cr seek" id="cSeek" min="0" max="1000" step="1" value="0" aria-label="Seek">
      <div class="times"><span id="cEl">0:00</span><span id="cRem">-0:00</span></div>
      <div class="next" id="cNext"></div>
    </div>
    <div class="ctrl">
      <button class="nl ib sk" id="cPrev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 5v14"/><path d="M19 5.5v13L9 12z"/></svg></button>
      <button class="nl ib pp" id="cPlay" aria-label="Play"><svg viewBox="0 0 24 24" id="cPlayIc"><path d="M8 5.2v13.6L19 12z"/></svg></button>
      <button class="nl ib sk" id="cNextB" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M18 5v14"/><path d="M5 5.5v13L15 12z"/></svg></button>
    </div>
    <div class="vol">
      <svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
      <input type="range" class="cr" id="cVol" min="0" max="100" value="85" aria-label="Volume">
    </div>
  </div>
  <div class="toast" id="cToast"></div>

  <!-- v2.2 Dash mode: full-screen night-drive screen. The visualizer is pure drawing (no audio analysis). -->
  <div id="dash" hidden>

    `<button class="nl ib x fav${FAV.has(it.sid) ? ' on' : ''}" data-fav aria-label="Favorite">${IC_HEART}</button><button class="nl ib x" data-add aria-label="Add to queue or playlist">${IC_PLUS}</button></div>`;
}
function vlSet(items, keep) {
  const el = $('bList'), sp = $('bSp'); VL.items = items; VL.from = VL.to = -1;
  if (!keep) el.scrollTop = 0;
  if (!items.length) { sp.style.height = ''; sp.innerHTML = `<div class="empty2">${emptyMsg()}</div>`; return; }
  sp.style.height = items.length * RH + 'px'; vlDraw();
}
function vlDraw(force) {
  if (!VL.items.length) return;
  const el = $('bList'), top = el.scrollTop, h = el.clientHeight || 600;
  const from = Math.max(0, Math.floor(top / RH) - 6), to = Math.min(VL.items.length, Math.ceil((top + h) / RH) + 6);
  if (!force && from === VL.from && to === VL.to) return;
  VL.from = from; VL.to = to; let html = '';
  for (let i = from; i < to; i++) html += rowHTML(VL.items[i], i);
  $('bSp').innerHTML = html;
}
function emptyMsg() {
  if (!LX.recs.length) return 'No songs yet. Load the song index from your PC, then link your phone\u2019s music folder.';
  if (BR.q) return 'Nothing matches that search.';
  if (BR.tab === 'stations') return 'No radio or mix folders found.';
  return 'Nothing here yet.';
}
// A–Z jump bar
const AZ = '#ABCDEFGHIJKLMNOPQRSTUVWXYZ';
let azMap = {};
function azBuild(on) {
  const bar = $('bAZ'); bar.hidden = !on || VL.items.length < 30; $('bList').classList.toggle('noaz', bar.hidden); azMap = {};
  if (bar.hidden) return;
  VL.items.forEach((it, i) => { const c = (nrm(it.grp ? it.label : it.t)[0] || '#').toUpperCase(), L = /[A-Z]/.test(c) ? c : '#'; if (azMap[L] == null) azMap[L] = i; });
  bar.innerHTML = [...AZ].map(c => `<span class="${azMap[c] != null ? 'on' : ''}">${c}</span>`).join('');
}
function azJump(e) {
  const bar = $('bAZ'), r = bar.getBoundingClientRect(), k = clamp(Math.floor((e.clientY - r.top) / r.height * AZ.length), 0, AZ.length - 1);
  let i = null; for (let j = k; j < AZ.length && i == null; j++) i = azMap[AZ[j]]; if (i == null) for (let j = k; j >= 0 && i == null; j--) i = azMap[AZ[j]];
  if (i != null) $('bList').scrollTop = i * RH;
  const pop = $('bAZPop'); pop.textContent = AZ[k]; pop.hidden = false; clearTimeout(azJump.t); azJump.t = setTimeout(() => { pop.hidden = true; }, 600);
}
$('bAZ').addEventListener('pointerdown', e => { e.preventDefault(); $('bAZ').setPointerCapture(e.pointerId); azJump(e); });
$('bAZ').addEventListener('pointermove', e => { if (e.buttons || e.pointerType === 'touch') azJump(e); });
$('bList').addEventListener('scroll', () => { if (!VL.raf) VL.raf = requestAnimationFrame(() => { VL.raf = 0; vlDraw(); }); }, { passive: true });
window.addEventListener('resize', () => { if ($('sBrw').classList.contains('open')) vlDraw(true); });

let curView = null, browseT = 0;
function browseSoon() { clearTimeout(browseT); browseT = setTimeout(() => { if ($('sBrw').classList.contains('open')) renderBrowse(true); }, 400); }
async function renderBrowse(keep) {
  if (BR.ct === 'm' && BR.tab === 'playlists' && !BR.q) plCache = await lists();
  const counts = { m: 0, a: 0, p: 0, v: 0 }; for (const r of LX.recs) counts[r.c]++;
  $('bCT').innerHTML = Object.keys(CTN).map(k => `<button data-ct="${k}" class="${BR.ct === k && !BR.q ? 'on' : ''}">${CTN[k]}<span>${counts[k] ? counts[k].toLocaleString() : ''}</span></button>`).join('');
  const tabs = BR.ct === 'm' ? MTABS : OTABS;
  $('bST').hidden = !!BR.q || !!BR.stack.length;
  $('bST').innerHTML = tabs.map(([k, l]) => `<button data-tab="${k}" class="${BR.tab === k ? 'on' : ''}">${l}</button>`).join('');
  // status: index + folder
  const playable = LX.recs.reduce((n, r) => n + (r.file ? 1 : 0), 0);
  let st = '';
  if (!LX.meta) st += `<span>No song index loaded.</span><button data-act="idx">Load index</button>`;
  else st += `<span>${LX.recs.length.toLocaleString()} songs${LX.files ? ` · ${playable.toLocaleString()} playable` : ''}</span>`;
  if (!LX.files) st += `<span>Folder not linked this session.</span><button data-act="dir">Link folder</button>`;
  else st += `<button data-act="dir">Re-link folder</button>`;
  $('bStat').innerHTML = st;
  const v = curView = currentView();
  $('bTitle').textContent = BR.q ? 'Search' : BR.stack.length ? v.title : 'Library';
  $('bBack').hidden = !BR.stack.length && !BR.q;
  // header actions
  let hd = '';
  if (BR.q) hd = `<h3>${esc(v.note || '')}</h3>`;
  else if (v.group) {
    hd = `<button class="nl btn hb" data-act="play">${IC_PL}Play</button><button class="nl btn hb" data-act="shuf">${IC_SH}Shuffle</button>`;
    if (v.group.kind === 'genres') { const ds = new Set(v.group.items.map(r => r.dec || 'Unknown')); hd += `<div class="decs seg">${['', ...DECS.filter(d => ds.has(d))].map(d => `<button data-dec="${esc(d)}" class="${BR.dec === d ? 'on' : ''}">${d || 'All decades'}</button>`).join('')}</div>`; }
  } else if (BR.ct === 'm') hd = `<button class="nl btn hb" data-act="shufall">${IC_SH}Shuffle all music</button>`;
  else hd = `<button class="nl btn hb" data-act="playall">${IC_PL}Play all</button>`;
  $('bHead').innerHTML = hd; $('bHead').hidden = !hd;
  drawRecent();
  vlSet(v.items, keep); azBuild(v.az);
}
function drawRecent() {
  const show = !BR.q && !BR.stack.length && BR.ct === 'm';
  const rs = show ? RECENT.map(libSong).filter(Boolean).slice(0, 12) : [];
  $('bRecent').hidden = !rs.length;
  $('bRecent').innerHTML = rs.length ? '<small>Recently played</small>' + rs.map(s => `<button data-sid="${esc(s.sid)}">${esc(s.r.t)}<i>${esc(s.r.a || '')}</i></button>`).join('') : '';
}
function shuffled(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function playRecs(recs, start, shuf) {
  let list = recs.filter(r => r && !r.grp && r.file);
  if (!list.length) return LX.files ? toast('None of those songs are on this phone') : needFolder();
  if (shuf) list = shuffled(list).slice(0, MAXQ);
  else { const s0 = recs[start], i0 = Math.max(0, list.indexOf(s0)); list = list.slice(i0, i0 + MAXQ); }
  const sids = list.map(r => r.sid), keep = song(idx);
  if (keep && P.playing) { queue = [keep.sid, ...sids.filter(x => x !== keep.sid)]; idx = 0; saveQueue(); closeSheets(); goTo(queue.length > 1 ? 1 : 0, 1.5); }
  else { queue = sids; idx = -1; saveQueue(); closeSheets(); goTo(0, 0); }
  toast(shuf ? `Shuffling ${list.length.toLocaleString()} songs` : `Playing ${list.length.toLocaleString()} songs`);
}
function openGroup(g) { BR.stack.push(g); BR.dec = ''; renderBrowse(); }
$('bList').addEventListener('click', e => {
  const row = e.target.closest('.li'); if (!row) return; e.preventDefault();
  const i = +row.dataset.i, it = VL.items[i]; if (!it) return;
  const b = e.target.closest('button');
  if (it.grp) {
    if (it.kind === 'list') return playList(it.list);
    if (b && b.hasAttribute('data-sh')) return playRecs(it.items, 0, true);
    return openGroup(it);
  }
  if (b && b.hasAttribute('data-fav')) { toggleFav(it.sid); b.classList.toggle('on', FAV.has(it.sid)); return; }
  if (b && b.hasAttribute('data-add')) return openPick(it);
  playRecs(VL.items, i, false);
});
$('bCT').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; BR.ct = b.dataset.ct; BR.stack = []; BR.q = ''; $('bQ').value = ''; BR.tab = BR.ct === 'm' ? (MTABS.some(t => t[0] === BR.tab) ? BR.tab : 'artists') : 'items'; renderBrowse(); });
$('bST').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; BR.tab = b.dataset.tab; BR.stack = []; renderBrowse(); });
$('bHead').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; e.preventDefault();
  if (b.dataset.dec != null) { BR.dec = b.dataset.dec; return renderBrowse(); }
  const a = b.dataset.act, v = curView;
  if (a === 'play') playRecs(v.items, 0, false);
  else if (a === 'shuf') playRecs(v.items, 0, true);
  else if (a === 'shufall') playRecs(recsOf('m'), 0, true);
  else if (a === 'playall') playRecs(v.items, 0, false);
});
$('bStat').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; e.preventDefault(); if (b.dataset.act === 'idx') $('bIdx').click(); else $('cDir').click(); });
$('bRecent').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; const s = libSong(b.dataset.sid); if (s) playRecs([s.r], 0, false); });
$('bBack').addEventListener('click', e => { e.preventDefault(); if (BR.q) { BR.q = ''; $('bQ').value = ''; } else { BR.stack.pop(); BR.dec = ''; } renderBrowse(); });
let qT = 0;
$('bQ').addEventListener('input', e => { clearTimeout(qT); qT = setTimeout(() => { BR.q = e.target.value.trim(); renderBrowse(); }, 180); });
$('bQ').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });
$('bIdx').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) loadIndexFile(f); };
// add-to chooser: play next / end of queue / a playlist
let pickRec = null;
async function openPick(r) {
  pickRec = r; const ls = await lists();
  $('bPickT').textContent = r.t;
  $('bPickL').innerHTML = `<button class="nl btn" data-p="next">Play next</button><button class="nl btn" data-p="end">Add to end of Up next</button>` +
    `<div class="sec">Add to playlist</div>` + ls.map(l => `<button class="nl btn" data-l="${esc(l.name)}">${esc(l.name)}</button>`).join('') + `<button class="nl btn" data-p="new">New playlist…</button>`;
  $('bPick').classList.add('open');
}
$('bPick').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return; e.preventDefault();
  const r = pickRec, close = () => $('bPick').classList.remove('open');
  if (b.hasAttribute('data-x') || !r) return close();
  if (!r.file && b.dataset.p !== 'new' && !b.dataset.l) { close(); return LX.files ? toast('That song is not on this phone') : needFolder(); }
  if (b.dataset.p === 'next' || b.dataset.p === 'end') {
    const j = queue.indexOf(r.sid); if (j >= 0 && j !== idx) { queue.splice(j, 1); if (j < idx) idx--; }
    if (j !== idx || j < 0) { if (b.dataset.p === 'next') queue.splice(idx + 1, 0, r.sid); else queue.push(r.sid); }
    if (idx < 0) { idx = 0; loadInto(cur(), song(0)); showSong(); }
    saveQueue(); showSong(); render(); toast(b.dataset.p === 'next' ? 'Playing next' : 'Added to Up next');
  } else {
    let name = b.dataset.l; if (b.dataset.p === 'new') { name = (prompt('New playlist name', 'Car mix') || '').trim(); if (!name || name === '__queue') return; }
    try { const l = (await idb('lists', 'readonly', s => s.get(name))) || { name, sids: [] }; if (!l.sids.includes(r.sid)) l.sids.push(r.sid); l.at = Date.now(); await idb('lists', 'readwrite', s => s.put(l)); toast(`Added to "${name}"`); } catch (err) { toast('Could not save the playlist'); }
  }
  close();
});

// ---------- start: restore songs, last queue and the song you were on ----------
async function restore() {
  try {
    navigator.storage && navigator.storage.persist && navigator.storage.persist().catch(() => {});
    await loadSavedIndex();
    const recs = await idb('songs', 'readonly', s => s.getAll());
    (recs || []).forEach(r => { if (r && r.blob) lib.set(r.sid, { sid: r.sid, name: r.name || (r.blob && r.blob.name) || 'Song', blob: r.blob, added: r.added || 0 }); });
    const q = await idb('lists', 'readonly', s => s.get('__queue'));
    queue = (q && q.sids || []).filter(has);
    if (!queue.length && lib.size) queue = [...lib.values()].sort((a, b) => a.added - b.added).map(s => s.sid);
    if (queue.length) {
      const now = store.get('dcar2-now', null); let i = now ? queue.indexOf(now.sid) : -1;
      idx = i >= 0 ? i : 0; const el = cur(), s0 = song(idx);
      if (s0 && s0.blob) { loadInto(el, s0); el.volume = gainOf(); if (i >= 0 && now.t > 3) el._restore = now.t; }
      showSong();
    }
  } catch (e) { console.warn('restore failed', e); }
  render();
}
render(); restore();
if (/^https?:$/.test(location.protocol) && 'serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => { reg.update().catch(() => {}); document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); }); }).catch(() => {});
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (reloaded || P.playing) return; reloaded = true; location.reload(); });
}
